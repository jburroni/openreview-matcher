[build-system]
requires = ["setuptools>=77", "cffi>=1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openreview-matcher"
version = "2.0.7"
description = "OpenReview matching library"
authors = [{ name = "Michael Spector", email = "spector@cs.umass.edu" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.*",
    "openreview-py",
    "ortools==9.*",
    "pytest>=9.0.3,<10",
    "sortedcontainers==2.*",
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "flask-cors==6.*",
    "cffi==2.*",
    "pre-commit==4.*",
    "celery==5.6.3",
    "redis==6.4.0",
    "MarkupSafe==3.*",
    "gunicorn==26.*",
    "flake8==7.*",
    "gurobipy",
    "kombu==5.*",
    "psutil",
    "scipy",
]

[project.optional-dependencies]
full = ["flower"]

[project.urls]
Homepage = "https://github.com/openreview/openreview-matcher"

[tool.setuptools.packages.find]
include = ["matcher*"]

[tool.setuptools.package-data]
"matcher.service.config" = ["*.cfg"]

[tool.autopep8]
max_line_length = 120
ignore = ["W504", "W504", "E402", "E731", "C40", "E741", "F40", "F841"]

[tool.black]
line-length = 79
target-version = ["py37"]
exclude = "(.eggs|.git|.hg|.mypy_cache|.nox|.tox|.venv*|.svn|_build|buck-out|build|dist|__pycache__)"
